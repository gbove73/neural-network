name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: neural-network-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Java model
        run: mvn --batch-mode verify
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Check web application
        working-directory: web
        run: npm run lint
      - name: Build static website
        working-directory: web
        run: npm run build
      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: neural-network-site
          path: web/out
          if-no-files-found: error

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gianlucabove.it/neural-network/
    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: neural-network-site
          path: site
      - name: Configure SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Deploy website
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync --archive --compress --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            site/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
